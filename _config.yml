title: Tech-Taco
description: > # this means to ignore newlines until "baseurl:"
  Each Tuesday, we’ll dive into a different topic, from coding basics and GitHub to AI and trending tech innovations. Our presentations are designed to be engaging and accessible, ensuring everyone can join the tech conversation, no matter your level of expertise.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://techtacos.org" # the base hostname & protocol for your site
# Build settings
markdown: kramdown

# The 2016 theme's stylesheets still use Sass @import; silence the deprecation
# spam until they're migrated to @use.
sass:
  silence_deprecations:
    - import
permalink: pretty

facebook:
  app_id: 

logo: /assets/images/tech-taco.svg

google_site_verification: googleXXXXXXXXXXXXXXXX.html

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Social networks usernames (many more available: google-plus, flickr, dribbble, pinterest, instagram, tumblr, linkedin, etc.)
social:
  - title: linkedin
    url: https://www.linkedin.com/company/innovation-club-niu/
